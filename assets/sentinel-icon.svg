<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B33"/>
      <stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12284A"/>
      <stop offset="1" stop-color="#0C1530"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="480" y1="313" x2="668" y2="400">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="radarClip">
      <circle cx="512" cy="490" r="180"/>
    </clipPath>
  </defs>

  <!-- background (Slack rounds the corners itself) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="500" r="430" fill="url(#glow)"/>

  <g transform="translate(512 512) scale(1.14) translate(-512 -512)">
  <!-- shield -->
  <path d="M512 168 C600 214 690 232 774 232 L774 474 C774 662 662 790 512 862 C362 790 250 662 250 474 L250 232 C334 232 424 214 512 168 Z"
        fill="url(#shieldFill)" stroke="url(#shield)" stroke-width="34" stroke-linejoin="round"/>

  <!-- radar -->
  <g clip-path="url(#radarClip)">
    <circle cx="512" cy="490" r="180" fill="#0A1A36"/>
    <!-- sweep: fades in toward the leading edge -->
    <path d="M512 490 L480.7 312.7 A180 180 0 0 1 667.9 400 Z" fill="url(#sweep)"/>
    <!-- grid -->
    <circle cx="512" cy="490" r="60" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="6"/>
    <circle cx="512" cy="490" r="120" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="6"/>
    <line x1="332" y1="490" x2="692" y2="490" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="5"/>
    <line x1="512" y1="310" x2="512" y2="670" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="5"/>
    <!-- blips: two quiet, one alert -->
    <circle cx="430" cy="537" r="11" fill="#67E8F9" fill-opacity="0.75"/>
    <circle cx="572" cy="386" r="12" fill="#67E8F9"/>
    <circle cx="627" cy="394" r="38" fill="#F43F5E" fill-opacity="0.25"/>
    <circle cx="627" cy="394" r="21" fill="#F43F5E"/>
  </g>
  <!-- leading edge of the sweep, outer ring, centre -->
  <line x1="512" y1="490" x2="667.9" y2="400" stroke="#A5F3FC" stroke-width="9" stroke-linecap="round"/>
  <circle cx="512" cy="490" r="180" fill="none" stroke="#22D3EE" stroke-width="12"/>
  <circle cx="512" cy="490" r="14" fill="#A5F3FC"/>
  </g>
</svg>
